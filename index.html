<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivero. — Universo de marcas (prototipo)</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
/* Identidad Rivero.: papel, tinta, negro para el logo, cobalto como único acento.
   Retícula de líneas de 1 px tipo plano técnico, esquinas rectas, mucho aire.
   El punto de "Rivero." es el sol del sistema. */
:root{--paper:#F7F7F5;--surface:#FFFFFF;--ink:#2A2A2A;--muted:#6B6B6B;--subtle:#8A8A8A;--line:#E2E2DE;--black:#000;--accent:#1E3A8A;--accent-soft:#E6EAF4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);font-family:Montserrat,sans-serif;color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;z-index:1}
a{color:inherit}
.logo3d{position:fixed;z-index:0;pointer-events:none;font-weight:900;color:var(--black);letter-spacing:-.035em;line-height:.74;white-space:nowrap;transform:translate(-100%,-100%)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(247,247,245,.95);z-index:6;gap:14px;flex-wrap:wrap}
.brand{text-decoration:none;color:var(--black)}
.brand b{font-weight:900;font-size:22px;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.bar{font-size:12px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;color:var(--muted);min-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar b{color:var(--accent);font-weight:600}
.views{display:flex;border:1px solid var(--line)}
.views a{font-size:12px;font-weight:600;padding:10px 14px;color:var(--ink);text-decoration:none;background:var(--surface);border-right:1px solid var(--line)}
.views a:last-child{border-right:0}
.views a.on{background:var(--accent);color:#fff}
.views a:focus-visible,.panel a:focus-visible,.cta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frame{position:fixed;inset:76px 14px 14px 14px;border:1px solid var(--line);z-index:2;pointer-events:none}
.frame i{position:absolute;width:14px;height:14px;border-color:var(--ink);border-style:solid}
.frame i:nth-child(1){top:-1px;left:-1px;border-width:1px 0 0 1px}.frame i:nth-child(2){top:-1px;right:-1px;border-width:1px 1px 0 0}
.frame i:nth-child(3){bottom:-1px;left:-1px;border-width:0 0 1px 1px}.frame i:nth-child(4){bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.fig{position:fixed;top:92px;left:32px;z-index:3;font-size:11px;color:var(--muted);line-height:1.6;pointer-events:none}
.fig b{display:block;font-weight:800;color:var(--black);font-size:12px}
.lbl{position:fixed;pointer-events:none;transform:translate(-50%,0);font-size:12px;font-weight:800;color:var(--black);white-space:nowrap;z-index:3}
.lbl.moon{font-weight:400;font-size:11px;color:var(--muted)}
.lbl.moon.on{color:var(--accent);font-weight:600}
.lbl.tag{font-weight:400;font-size:10px;color:var(--subtle);transform:translate(-50%,-50%);background:var(--paper);padding:1px 5px;border:1px solid var(--line)}
.panel{position:fixed;right:32px;bottom:32px;width:360px;background:var(--surface);border:1px solid var(--line);padding:26px 28px;z-index:4}
.crumbs{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs span{color:var(--subtle)}
.num{font-weight:300;font-size:52px;color:var(--subtle);line-height:1}
.panel h2{font-weight:900;font-size:28px;color:var(--black);line-height:1.1;margin-top:12px;letter-spacing:-.01em}
.for{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.lead{font-weight:600;font-size:17px;color:var(--black);margin-top:16px;line-height:1.4}
.panel p{font-weight:300;font-size:16px;line-height:1.55;margin-top:6px}
.list{list-style:none;margin-top:16px;border-top:1px solid var(--line)}
.list a{font-size:13px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;text-decoration:none;color:var(--ink)}
.list a:hover,.list a.on{color:var(--accent)}
.list a span{color:var(--subtle)}
.cta{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:2px;border:0;cursor:pointer;font-family:inherit;text-decoration:none}
.msg{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}
.note{position:fixed;left:32px;bottom:32px;font-size:12px;color:var(--muted);max-width:300px;line-height:1.55;z-index:4;border-left:1px solid var(--ink);padding-left:12px;background:rgba(247,247,245,.9)}
.note kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);background:var(--surface);padding:0 4px}
@media(max-width:820px){.top{padding:10px 14px}.brand b{font-size:19px}.bar{min-width:0;flex:1 1 100%;order:3}.frame,.fig,.note{display:none}
 .panel{left:10px;right:10px;bottom:10px;width:auto;padding:16px 18px}.num{font-size:28px}.panel h2{font-size:22px;margin-top:6px}.panel p{display:none}.lead{font-size:15px;margin-top:8px}.list{display:none}.cta{margin-top:10px}}
</style>
</head>
<body>
<div id="c"></div>
<div class="logo3d" id="logo3d">Rivero</div>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="fig" id="fig"></div>
<header class="top">
  <a class="brand" href="#universo"><b>Rivero<i>.</i></b><small>Webs y apps con identidad</small></a>
  <div class="bar" id="bar"></div>
  <nav class="views" id="views"></nav>
</header>
<aside class="panel" id="panel">
  <nav class="crumbs" id="crumbs"></nav>
  <div class="num" id="num"></div>
  <h2 id="ttl"></h2>
  <div class="for" id="for"></div>
  <div class="lead" id="lead"></div>
  <p id="txt"></p>
  <div class="list" id="list"></div>
  <a class="cta" id="ctaLink" target="_blank" rel="noopener"></a><button class="cta" id="cta"></button>
  <div class="msg" id="msg"></div>
</aside>
<div class="note">Prototipo provisional. Rivero. es el sol y cada planeta es una marca. Arrastra para girar, toca un planeta y después sus lunas. Con el teclado: <kbd>←</kbd> <kbd>→</kbd> para cambiar y <kbd>Esc</kbd> para subir un nivel.</div>

<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script>
{
const P=[
 {id:'motos-julio',name:'Motos Julio',r:11,size:1.6,speed:.045,a0:.6,num:'01',for:'Marca real · taller y tienda de motos',lead:'Su web de siempre, renovada y vendiendo.',txt:'Réplica y migración de su web a código propio, con una tienda que se actualiza a partir de fotos.',cta:'Ver la web real',link:'https://motosjulio.es',
  moons:[
   {slug:'web',n:'Web',lead:'La web de siempre, en código propio.',txt:'Réplica fiel de la web anterior, migrada a un repositorio y publicada en su hosting.'},
   {slug:'tienda',n:'Tienda online',lead:'Un catálogo que se mueve solo.',txt:'Motos y recambios que se suben por lotes a partir de las fotos que manda el taller.'},
   {slug:'fichas',n:'Fichas de producto',lead:'Cada pieza, con su estado.',txt:'Fotos, precio y estado de cada producto: disponible, reservado o vendido.'}]},
 {id:'nomada-sur',name:'Nómada Sur',tex:true,r:19,size:2.1,speed:.024,a0:3.6,num:'02',for:'Marca ficticia · agencia de viajes a medida',lead:'Una marca para quien viaja sin prisa.',txt:'Marca inventada para el prototipo: identidad, web y redes para una agencia de viajes de Granada.',cta:'Ver el proyecto',
  moons:[
   {slug:'luna',n:'Luna',lead:'Un satélite propio: el cuaderno de rutas.',txt:'Un blog que gira alrededor de la marca y la alimenta con rutas, consejos y fotos.'},
   {slug:'branding',n:'Branding',lead:'Identidad para viajar sin prisa.',txt:'Nombre, logotipo, paleta de tierra y una voz cercana que suena a recomendación de amigo.'},
   {slug:'web',n:'Web',lead:'Del sueño a la llamada.',txt:'Un buscador de viajes a medida que termina en una cosa sencilla: reservar una llamada.'},
   {slug:'redes',n:'Redes sociales',lead:'Viajes que se cuentan solos.',txt:'Calendario editorial con rutas, consejos y las fotos de quienes ya viajaron.'}]}
];
const U={num:'00',name:'Rivero.',for:'Webs y apps con identidad',lead:'Tu negocio tiene que reflejar lo que das.',txt:'Cada planeta es una marca. Entra en uno y verás que una web puede ser mucho más que páginas: se explora.',cta:'Elige un planeta'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('views').innerHTML='<a href="#universo" data-m="universo">Universo</a>'+P.map(p=>`<a href="#${p.id}" data-m="${p.id}">${esc(p.name)}</a>`).join('');

const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0xF7F7F5,0);
$('c').appendChild(R.domElement);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(40,1,.1,500);C.position.set(0,34,44);
const ctr=new THREE.OrbitControls(C,R.domElement);
ctr.enableDamping=true;ctr.enablePan=false;ctr.minDistance=18;ctr.maxDistance=140;ctr.maxPolarAngle=1.42;

S.add(new THREE.AmbientLight(0xffffff,.8));
const sunLight=new THREE.PointLight(0xffffff,.32,0);S.add(sunLight);
const grid=new THREE.GridHelper(140,70,0xE2E2DE,0xE2E2DE);grid.position.y=-3.5;S.add(grid);

/* ejes de plano técnico */
[[1,0],[0,1]].forEach(([x,z])=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-26*x,0,-26*z),new THREE.Vector3(26*x,0,26*z)]);
 const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0xB9B9B4,dashSize:.5,gapSize:.5,transparent:true,opacity:.8}));l.computeLineDistances();S.add(l)});

function ring(rad){const pts=[];for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad))}
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xB9B9B4,transparent:true}));S.add(l);return l}
function body(size,fill,edge){const g=new THREE.Group();
 const mm=new THREE.MeshLambertMaterial({color:fill,transparent:true});
 const em=new THREE.MeshBasicMaterial({color:edge,transparent:true,side:THREE.BackSide});
 const lm=new THREE.LineBasicMaterial({color:edge,transparent:true});
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,96,64),mm);
 g.add(new THREE.Mesh(new THREE.SphereGeometry(size*1.035,96,64),em));g.add(mesh);
 const pts=[];for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*size*1.002,0,Math.sin(a)*size*1.002))}
 g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm));
 g.rotation.x=.38;g.userData={mm,em,lm,mesh,size};S.add(g);return g}
function label(text,cls){const d=document.createElement('div');d.className='lbl '+cls;d.textContent=text;document.body.appendChild(d);return d}

/* el sol: el punto de Rivero. */
const sun=new THREE.Group();
const sunMat=new THREE.MeshBasicMaterial({color:0x1E3A8A,transparent:true});
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(2.4,96,64),sunMat);sun.add(sunMesh);
const halo=new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({length:129},(_,i)=>{const a=i/128*Math.PI*2;return new THREE.Vector3(Math.cos(a)*3.4,0,Math.sin(a)*3.4)})),new THREE.LineBasicMaterial({color:0x1E3A8A,transparent:true,opacity:.5}));sun.add(halo);
S.add(sun);sunMesh.userData.go='universo';
const clickables=[sunMesh];

P.forEach(p=>{
 p.orbit=ring(p.r);
 p.g=body(p.size,0xFFFFFF,0x2A2A2A);p.g.userData.lbl=label(p.name,'');
 p.g.userData.mesh.userData.go=p.id;clickables.push(p.g.userData.mesh);
 p.tag=label(p.num+' · órbita','tag');
 p.m=p.moons.map((mo,i)=>{const m=body(.3,0xFFFFFF,0x6B6B6B);m.userData.lbl=label(mo.n,'moon');m.userData.i=i;m.userData.mesh.userData.go=p.id+'--'+mo.slug;clickables.push(m.userData.mesh);mo.g=m;return m});
});

/* planeta texturizado: la Tierra */
const TL=new THREE.TextureLoader();
const E=P.find(p=>p.tex);
E.g.children[0].visible=false;E.g.children[2].visible=false;
E.g.userData.mesh.material=E.g.userData.mm=new THREE.MeshPhongMaterial({map:TL.load('tex/earth_atmos_2048.jpg'),normalMap:TL.load('tex/earth_normal_2048.jpg'),specularMap:TL.load('tex/earth_specular_2048.jpg'),shininess:18,specular:new THREE.Color(0x333333),transparent:true});
E.clouds=new THREE.Mesh(new THREE.SphereGeometry(E.size*1.012,96,64),new THREE.MeshLambertMaterial({color:0xffffff,alphaMap:TL.load('tex/earth_clouds_1024.png'),transparent:true,depthWrite:false}));E.g.add(E.clouds);
E.atm=new THREE.Mesh(new THREE.SphereGeometry(E.size*1.07,96,64),new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{op:{value:1}},
 vertexShader:'varying vec3 n;varying vec3 v;void main(){n=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform float op;varying vec3 n;varying vec3 v;void main(){float f=pow(1.-max(dot(n,v),0.),3.);gl_FragColor=vec4(.3,.55,1.,f*op);}'}));E.g.add(E.atm);

function rocketTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.translate(64,64);
 x.fillStyle='#F28C28';x.beginPath();x.moveTo(-9,30);x.quadraticCurveTo(0,64,9,30);x.fill();
 x.fillStyle='#FFD166';x.beginPath();x.moveTo(-5,30);x.quadraticCurveTo(0,50,5,30);x.fill();
 x.fillStyle='#1E3A8A';x.beginPath();x.moveTo(-12,12);x.lineTo(-25,34);x.lineTo(-12,30);x.fill();x.beginPath();x.moveTo(12,12);x.lineTo(25,34);x.lineTo(12,30);x.fill();
 x.fillStyle='#fff';x.strokeStyle='#2A2A2A';x.lineWidth=2.5;x.beginPath();x.moveTo(0,-50);x.bezierCurveTo(21,-26,16,18,12,32);x.lineTo(-12,32);x.bezierCurveTo(-16,18,-21,-26,0,-50);x.fill();x.stroke();
 x.fillStyle='#1E3A8A';x.beginPath();x.arc(0,-12,7,0,7);x.fill();x.stroke();
 return new THREE.CanvasTexture(c)}
function moonTex(){const W=1024,H=512,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#B8B4A8';x.fillRect(0,0,W,H);
 let sd=42;function rn(){sd=(sd*16807)%2147483647;return sd/2147483647}
 [[.17,.44,.2,.45],[.34,.38,.14,.5],[.52,.34,.17,.4],[.68,.42,.11,.45],[.44,.56,.09,.35],[.25,.52,.08,.3],[.6,.48,.13,.4]].forEach(([mx,my,mr,a])=>{const gd=x.createRadialGradient(mx*W,my*H,0,mx*W,my*H,mr*W);gd.addColorStop(0,`rgba(85,82,74,${a})`);gd.addColorStop(.6,`rgba(95,92,84,${a*.5})`);gd.addColorStop(1,'rgba(95,92,84,0)');x.fillStyle=gd;x.fillRect(0,0,W,H)});
 for(let i=0;i<300;i++){const cx=rn()*W,cy=rn()*H,cr=rn()*14+1.5,bright=rn()>.5;
  x.beginPath();x.arc(cx,cy,cr,0,7);x.fillStyle=`rgba(${bright?'200,196,186':'75,72,65'},${rn()*.25+.08})`;x.fill();
  if(cr>4){x.beginPath();x.arc(cx,cy,cr*1.15,0,7);x.strokeStyle=`rgba(210,206,196,${rn()*.2+.05})`;x.lineWidth=.8;x.stroke()}}
 const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rn()-.5)*16;d[i]+=n;d[i+1]+=n;d[i+2]+=n}
 x.putImageData(id,0,0);return new THREE.CanvasTexture(c)}

/* la Luna de verdad para el primer satélite de la Tierra */
const luna=E.m[0];luna.children[0].visible=false;luna.children[2].visible=false;
luna.userData.mesh.material=luna.userData.mm=new THREE.MeshPhongMaterial({map:moonTex(),shininess:2,transparent:true});
luna.scale.set(1.9,1.9,1.9);luna.userData.size=.57;

/* estado */
let fp=null,fm=null,flying=true,t=0,mt=0;

/* cohete: sale del punto de Rivero. hacia la Tierra */
const rocket=new THREE.Sprite(new THREE.SpriteMaterial({map:rocketTex(),transparent:true,depthWrite:false}));rocket.scale.set(2.4,2.4,1);S.add(rocket);
const trail=[],trailGeo=new THREE.BufferGeometry(),trailMat=new THREE.PointsMaterial({color:0x8A8A8A,size:.16,transparent:true,opacity:.7});S.add(new THREE.Points(trailGeo,trailMat));
let lastU=0;const rA=new THREE.Vector3(),rB=new THREE.Vector3(),rM=new THREE.Vector3(),q1=new THREE.Vector3(),q2=new THREE.Vector3();
function bez(u,o){const k=1-u;return o.set(0,0,0).addScaledVector(rA,k*k).addScaledVector(rM,2*k*u).addScaledVector(rB,u*u)}
function flyRocket(){
 rA.set(0,0,0);rB.copy(E.g.position);rM.copy(rB).multiplyScalar(.5);rM.y+=10;
 const u=(t*.09)%1;if(u<lastU)trail.length=0;lastU=u;
 bez(u,rocket.position);bez(Math.min(u+.01,1),q2);
 q1.copy(rocket.position).project(C);q2.project(C);
 rocket.material.rotation=Math.atan2(q2.y-q1.y,(q2.x-q1.x)*C.aspect)-Math.PI/2;
 const s=Math.sin(u*Math.PI);rocket.scale.set(2.4*s+.4,2.4*s+.4,1);
 trail.push(rocket.position.clone());if(trail.length>70)trail.shift();trailGeo.setFromPoints(trail);
 const vis=(!fp||fp===E)&&!fm?1:.06;
 rocket.material.opacity+=(vis-rocket.material.opacity)*.08;trailMat.opacity=rocket.material.opacity*.7;
}

/* navegación: universo → planeta → luna */
const ACC=new THREE.Color(0x1E3A8A),WHITE=new THREE.Color(0xFFFFFF),INK=new THREE.Color(0x2A2A2A),SOFT=new THREE.Color(0xE6EAF4),RING=new THREE.Color(0xB9B9B4),GREY=new THREE.Color(0x6B6B6B);
const two=n=>String(n).padStart(2,'0');
function parse(h){const [pid,ms]=h.split('--');const p=P.find(x=>x.id===pid)||null;const m=p&&ms?p.moons.find(x=>x.slug===ms)||null:null;return [p,m]}
function setMode(h){
 [fp,fm]=parse(h);flying=true;ctr.enabled=false;
 const d=fm||fp||U,i=fm?fp.moons.indexOf(fm):-1,num=fm?fp.num+'.'+two(i+1):d.num;
 $('num').textContent=num;
 $('ttl').textContent=fm?fm.n:d.name;
 $('for').textContent=fm?fp.name+' · '+(fp.link?'marca real':'marca ficticia'):d.for;
 $('lead').textContent=d.lead;$('txt').textContent=d.txt;$('msg').textContent='';
 const items=fp?fp.moons.map((m,j)=>({h:fp.id+'--'+m.slug,n:m.n,k:fp.num+'.'+two(j+1),on:m===fm})):P.map(p=>({h:p.id,n:p.name+' — '+(p.link?'real':'ficticia'),k:p.num}));
 $('list').innerHTML=items.map(x=>`<a href="#${x.h}" class="${x.on?'on':''}">${esc(x.n)}<span>${x.k}</span></a>`).join('');
 const cr=[['universo','Rivero.']];if(fp)cr.push([fp.id,fp.name]);if(fm)cr.push([fp.id+'--'+fm.slug,fm.n]);
 $('crumbs').innerHTML=cr.map((c,j)=>j<cr.length-1?`<a href="#${c[0]}">${esc(c[1])}</a><span>/</span>`:`<b>${esc(c[1])}</b>`).join('');
 $('bar').innerHTML='josecarlosrivero.es'+(fp?'<b>/'+fp.id+(fm?'/'+fm.slug:'')+'</b>':'');
 const link=!fm&&fp&&fp.link;
 $('ctaLink').style.display=link?'inline-block':'none';$('cta').style.display=link?'none':'inline-block';
 if(link){$('ctaLink').href=fp.link;$('ctaLink').textContent=fp.cta}
 $('cta').textContent=fm?'Ver esta pieza':(fp?fp.cta:U.cta);
 $('fig').innerHTML='<b>Fig. '+num+'</b>'+(fm?esc(fp.name)+' · luna '+(i+1)+' de '+fp.moons.length:fp?'Planeta '+fp.num+' · '+fp.moons.length+' lunas':'Sistema Rivero. · '+P.length+' planetas');
 document.querySelectorAll('#views a').forEach(a=>a.classList.toggle('on',a.dataset.m===(fp?fp.id:'universo')));
 P.forEach(p=>p.m.forEach((m,j)=>m.userData.lbl.classList.toggle('on',p===fp&&p.moons[j]===fm)));
}
$('cta').onclick=()=>{$('msg').textContent=!fp?'Toca un planeta o usa las pestañas de arriba.':fm?'En la web real, aquí se abriría esta pieza completa.':'Proyecto de ejemplo: en la web real, aquí estaría el caso completo.'};
addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
addEventListener('keydown',e=>{
 if(e.key==='Escape'){location.hash=fm?fp.id:'universo'}
 else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const dir=e.key==='ArrowRight'?1:-1;
  if(fm){const n=fp.moons.length,j=(fp.moons.indexOf(fm)+dir+n)%n;location.hash=fp.id+'--'+fp.moons[j].slug}
  else{const ids=['universo',...P.map(p=>p.id)],j=(ids.indexOf(fp?fp.id:'universo')+dir+ids.length)%ids.length;location.hash=ids[j]}}
});

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
function hit(e){ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(ptr,C);
 const h=ray.intersectObjects(clickables).filter(x=>x.object.material.opacity>.3);return h.length?h[0].object.userData.go:null}
R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>5)return;const g=hit(e);if(g)location.hash=g});
R.domElement.addEventListener('pointermove',e=>{R.domElement.style.cursor=hit(e)?'pointer':'grab'});

const HOME=new THREE.Vector3(0,34,44);
function fade(g,v){const mm=g.userData.mm;mm.opacity+=(v-mm.opacity)*.08;g.userData.em.opacity=g.userData.lm.opacity=mm.opacity;const l=g.userData.lbl;if(l)l.style.opacity=mm.opacity}
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3(),right=new THREE.Vector3();
function proj(v){v.project(C);return[(v.x*.5+.5)*innerWidth,(-v.y*.5+.5)*innerHeight,v.z<1]}
function place(g){const l=g.userData.lbl;g.getWorldPosition(tmp);tmp.y-=g.userData.size*g.scale.x+.5;const[x,y,ok]=proj(tmp);l.style.left=x+'px';l.style.top=y+'px';l.style.display=ok?'block':'none'}
const logo=$('logo3d');
function placeLogo(op){
 right.setFromMatrixColumn(C.matrixWorld,0);
 tmp.set(0,0,0);const[cx,cy,ok]=proj(tmp);tmp2.copy(right).multiplyScalar(2.4);const[rx,ry]=proj(tmp2);
 const r=Math.hypot(rx-cx,ry-cy);logo.style.fontSize=(r*(K>1?2:2.5))+"px";
 logo.style.left=(cx-r*1.12)+'px';logo.style.top=(cy+r*.98)+'px';logo.style.opacity=ok?op:0;
}

let K=1;function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();K=C.aspect<1?Math.min(2.1,1/C.aspect):1;HOME.set(0,34*K,44*K)}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock(),want=new THREE.Vector3(),UP2=new THREE.Vector3(0,2.2,0),UP5=new THREE.Vector3(0,5,0),ORIGIN=new THREE.Vector3();
let logoOp=1;
function loop(){
 const dt=Math.min(clock.getDelta(),.05);t+=dt;if(!fm)mt+=dt;
 sun.rotation.y+=dt*.05;sunMat.opacity+=((fp?.12:1)-sunMat.opacity)*.08;halo.material.opacity=sunMat.opacity*.5;
 P.forEach(p=>{
  const a=p.a0+t*p.speed;p.g.position.set(Math.cos(a)*p.r,0,Math.sin(a)*p.r);p.g.rotation.y+=dt*(p.tex?.08:.15);
  const on=!fp||fp===p,isF=fp===p;fade(p.g,on?(fm&&isF?.35:1):.06);
  if(p.tex){p.clouds.rotation.y+=dt*.02;p.clouds.material.opacity=p.g.userData.mm.opacity*.95;p.atm.material.uniforms.op.value=p.g.userData.mm.opacity}
  else{p.g.userData.mm.color.lerp(isF&&!fm?ACC:WHITE,.08);p.g.userData.em.color.lerp(isF&&!fm?ACC:INK,.08);p.g.userData.lm.color.lerp(isF&&!fm?SOFT:INK,.08)}
  p.orbit.material.opacity+=((on?1:.06)-p.orbit.material.opacity)*.08;p.orbit.material.color.lerp(isF?ACC:RING,.08);
  place(p.g);if(fm&&isF)p.g.userData.lbl.style.opacity=0;
  tmp.set(Math.cos(-.75)*p.r,0,Math.sin(-.75)*p.r);const[tx,ty,tok]=proj(tmp);p.tag.style.left=tx+'px';p.tag.style.top=ty+'px';p.tag.style.display=tok?'block':'none';p.tag.style.opacity=fp?0:1;
  p.m.forEach((m,j)=>{const n=p.m.length,isL=m===luna,b=mt*(isL?.18:.35)+j*Math.PI*2/n,d=p.size+(isL?3.2:1.6);
   if(isL)m.userData.mesh.rotation.y+=dt*.04;
   m.position.set(p.g.position.x+Math.cos(b)*d,Math.sin(b)*.35*d,p.g.position.z+Math.sin(b)*d);
   const mF=!!fm&&fm.g===m;
   if(!isL){m.userData.mm.color.lerp(mF?ACC:WHITE,.08);m.userData.em.color.lerp(mF?ACC:GREY,.08)}
   fade(m,isF?(fm&&!mF?.6:1):(fp?0:.55));if(!isF)m.userData.lbl.style.opacity=0;place(m)});
 });
 flyRocket();
 if(fm){
  const mp=fm.g.position,dir=mp.clone().sub(fp.g.position).setY(0).normalize();
  want.copy(mp).addScaledVector(dir,4.5*K).add(UP2);
  C.position.lerp(want,.06);ctr.target.lerp(mp,.1);C.lookAt(ctr.target);
 }else if(fp){
  const pp=fp.g.position,dir=pp.clone().normalize();
  want.copy(pp).addScaledVector(dir,9*K).add(UP5);
  C.position.lerp(want,.05);ctr.target.lerp(pp,.08);C.lookAt(ctr.target);
 }else if(flying){
  C.position.lerp(HOME,.05);ctr.target.lerp(ORIGIN,.08);C.lookAt(ctr.target);
  if(C.position.distanceTo(HOME)<.4){flying=false;ctr.enabled=true}
 }else ctr.update();
 C.updateMatrixWorld();logoOp+=((fp?.08:1)-logoOp)*.08;placeLogo(logoOp);
 R.render(S,C);requestAnimationFrame(loop);
}
setMode(location.hash.slice(1)||'universo');loop();
}
</script>
</body>
