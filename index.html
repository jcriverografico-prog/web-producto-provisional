<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivero. — Universo de marcas (prototipo)</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
/* Identidad Rivero.: papel, tinta, negro para el logo, cobalto como único acento.
   Líneas de 1 px tipo plano técnico, esquinas rectas, mucho aire.
   El logo de Rivero. es el sol del sistema; cada planeta lleva el logo de su marca. */
:root{--paper:#F7F7F5;--surface:#FFFFFF;--ink:#2A2A2A;--muted:#6B6B6B;--subtle:#8A8A8A;--line:#E2E2DE;--black:#000;--accent:#1E3A8A;--accent-soft:#E6EAF4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);font-family:Montserrat,sans-serif;color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;z-index:1}
a{color:inherit}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(247,247,245,.95);z-index:6;gap:14px;flex-wrap:wrap}
.brand{text-decoration:none;color:var(--black)}
.brand b{font-weight:900;font-size:22px;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.bar{font-size:12px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;color:var(--muted);min-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar b{color:var(--accent);font-weight:600}
.views{display:flex;border:1px solid var(--line)}
.views a{font-size:12px;font-weight:600;padding:10px 14px;color:var(--ink);text-decoration:none;background:var(--surface);border-right:1px solid var(--line)}
.views a:last-child{border-right:0}
.views a.on{background:var(--accent);color:#fff}
.views a:focus-visible,.panel a:focus-visible,.panel button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frame{position:fixed;inset:76px 14px 14px 14px;border:1px solid var(--line);z-index:2;pointer-events:none}
.frame i{position:absolute;width:14px;height:14px;border-color:var(--ink);border-style:solid}
.frame i:nth-child(1){top:-1px;left:-1px;border-width:1px 0 0 1px}.frame i:nth-child(2){top:-1px;right:-1px;border-width:1px 1px 0 0}
.frame i:nth-child(3){bottom:-1px;left:-1px;border-width:0 0 1px 1px}.frame i:nth-child(4){bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.fig{position:fixed;top:92px;left:32px;z-index:3;font-size:11px;color:var(--muted);line-height:1.6;pointer-events:none}
.fig b{display:block;font-weight:800;color:var(--black);font-size:12px}
.lbl{position:fixed;pointer-events:none;transform:translate(-50%,0);font-size:12px;font-weight:800;color:var(--black);white-space:nowrap;z-index:3}
.lbl.tag{font-weight:400;font-size:10px;color:var(--subtle);transform:translate(-50%,-50%);background:var(--paper);padding:1px 5px;border:1px solid var(--line)}
.panel{position:fixed;right:32px;bottom:32px;width:360px;background:var(--surface);border:1px solid var(--line);padding:26px 28px;z-index:4}
.crumbs{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs span{color:var(--subtle)}
.num{font-weight:300;font-size:52px;color:var(--subtle);line-height:1}
.panel h2{font-weight:900;font-size:28px;color:var(--black);line-height:1.1;margin-top:12px;letter-spacing:-.01em}
.for{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.lead{font-weight:600;font-size:17px;color:var(--black);margin-top:16px;line-height:1.4}
.panel p{font-weight:300;font-size:16px;line-height:1.55;margin-top:6px}
.list{margin-top:16px;border-top:1px solid var(--line)}
.list a{font-size:13px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;text-decoration:none;color:var(--ink)}
.list a:hover,.list a.on{color:var(--accent)}
.list a span{color:var(--subtle)}
.alt{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--muted)}
.alt button{font:600 12px Montserrat,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer;min-width:36px}
.alt button.on{border-color:var(--accent);color:var(--accent)}
.cta{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:2px;border:0;cursor:pointer;font-family:inherit;text-decoration:none}
.msg{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}
.note{position:fixed;left:32px;bottom:32px;font-size:12px;color:var(--muted);max-width:300px;line-height:1.55;z-index:4;border-left:1px solid var(--ink);padding-left:12px;background:rgba(247,247,245,.9)}
.note kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);background:var(--surface);padding:0 4px}
/* intro */
.top,.panel,.note,.fig,.frame{transition:opacity .9s ease}
body.intro .top,body.intro .panel,body.intro .note,body.intro .fig,body.intro .frame{opacity:0;pointer-events:none}
body.intro .lbl{visibility:hidden}
.welcome{position:fixed;left:0;right:0;top:66%;z-index:7;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s ease}
body.intro .welcome{opacity:1}
.welcome h1{font-weight:300;font-size:clamp(20px,2.6vw,30px);color:var(--ink);letter-spacing:-.01em}
.welcome h1 b{font-weight:900;color:var(--black)}
.welcome p{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.skip{position:fixed;right:24px;bottom:22px;z-index:7;font:600 12px Montserrat,sans-serif;color:var(--muted);background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;opacity:0;transition:opacity .6s}
body.intro .skip{opacity:1}
body:not(.intro) .skip{pointer-events:none}
@media(max-width:820px){.top{padding:10px 14px}.brand b{font-size:19px}.bar{min-width:0;flex:1 1 100%;order:3}.frame,.fig,.note{display:none}
 .panel{left:10px;right:10px;bottom:10px;width:auto;padding:16px 18px}.num{font-size:28px}.panel h2{font-size:22px;margin-top:6px}.panel p{display:none}.lead{font-size:15px;margin-top:8px}.list{display:none}.cta{margin-top:10px}.welcome{top:60%;padding:0 20px}}
</style>
</head>
<body>
<div id="c"></div>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="fig" id="fig"></div>
<div class="welcome" id="welcome"><h1>Te doy la bienvenida al universo <b>Rivero.</b></h1><p>Cada planeta es una marca</p></div>
<button class="skip" id="skip">Saltar intro</button>
<header class="top">
  <a class="brand" href="#universo"><b>Rivero<i>.</i></b><small>Webs y apps con identidad</small></a>
  <div class="bar" id="bar"></div>
  <nav class="views" id="views"></nav>
</header>
<aside class="panel" id="panel">
  <nav class="crumbs" id="crumbs"></nav>
  <div class="num" id="num"></div>
  <h2 id="ttl"></h2>
  <div class="for" id="for"></div>
  <div class="lead" id="lead"></div>
  <p id="txt"></p>
  <div class="alt" id="alt"></div>
  <div class="list" id="list"></div>
  <a class="cta" id="ctaLink" target="_blank" rel="noopener"></a><button class="cta" id="cta"></button>
  <div class="msg" id="msg"></div>
</aside>
<div class="note">Prototipo provisional. Rivero. es el sol y cada planeta es una marca. Arrastra para girar y toca un planeta para entrar. Con el teclado: <kbd>←</kbd> <kbd>→</kbd> para cambiar y <kbd>Esc</kbd> para subir un nivel.</div>

<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script>
{
const P=[
 {id:'motos-julio',name:'Motos Julio',r:13,size:2.2,speed:.045,a0:.6,num:'01',for:'Marca real · taller y tienda de motos',lead:'Su web de siempre, renovada y vendiendo.',txt:'Réplica y migración de su web a código propio, con una tienda que se actualiza a partir de fotos.',cta:'Ver la web real',link:'https://motosjulio.es',
  logos:['img/motos-julio-a.png','img/motos-julio-b.png'],
  parts:[
   {slug:'web',n:'Web',lead:'La web de siempre, en código propio.',txt:'Réplica fiel de la web anterior, migrada a un repositorio y publicada en su hosting.'},
   {slug:'tienda',n:'Tienda online',lead:'Un catálogo que se mueve solo.',txt:'Motos y recambios que se suben por lotes a partir de las fotos que manda el taller.'},
   {slug:'fichas',n:'Fichas de producto',lead:'Cada pieza, con su estado.',txt:'Fotos, precio y estado de cada producto: disponible, reservado o vendido.'}]},
 {id:'nomada-sur',name:'Nómada Sur',r:21,size:2.6,speed:.024,a0:3.6,num:'02',for:'Marca ficticia · agencia de viajes a medida',lead:'Una marca para quien viaja sin prisa.',txt:'Marca inventada para el prototipo: identidad, web y redes para una agencia de viajes de Granada.',cta:'Ver el proyecto',
  logos:['img/nomada-sur-a.png','img/nomada-sur-b.png'],
  parts:[
   {slug:'branding',n:'Branding',lead:'Identidad para viajar sin prisa.',txt:'Nombre, logotipo, paleta de tierra y una voz cercana que suena a recomendación de amigo.'},
   {slug:'web',n:'Web',lead:'Del sueño a la llamada.',txt:'Un buscador de viajes a medida que termina en una cosa sencilla: reservar una llamada.'},
   {slug:'blog',n:'Cuaderno de rutas',lead:'Un blog que alimenta la marca.',txt:'Rutas, consejos y fotos que traen visitas desde Google y dan motivos para volver.'},
   {slug:'redes',n:'Redes sociales',lead:'Viajes que se cuentan solos.',txt:'Calendario editorial con rutas, consejos y las fotos de quienes ya viajaron.'}]}
];
const U={num:'00',name:'Rivero.',for:'Webs y apps con identidad',lead:'Tu negocio tiene que reflejar lo que das.',txt:'Cada planeta es una marca. Entra en uno y verás que una web puede ser mucho más que páginas: se explora.',cta:'Elige un planeta'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two=n=>String(n).padStart(2,'0');
$('views').innerHTML='<a href="#universo" data-m="universo">Universo</a>'+P.map(p=>`<a href="#${p.id}" data-m="${p.id}">${esc(p.name)}</a>`).join('');

const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0xF7F7F5,0);
$('c').appendChild(R.domElement);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(40,1,.1,600);
const ctr=new THREE.OrbitControls(C,R.domElement);
ctr.enableDamping=true;ctr.enablePan=false;ctr.minDistance=18;ctr.maxDistance=160;ctr.maxPolarAngle=1.42;
S.add(new THREE.AmbientLight(0xffffff,.85));
const sunLight=new THREE.PointLight(0xffffff,.3,0);S.add(sunLight);
const TL=new THREE.TextureLoader();
function tex(url){const t=TL.load(url);t.anisotropy=R.capabilities.getMaxAnisotropy();t.encoding=THREE.sRGBEncoding;return t}
R.outputEncoding=THREE.sRGBEncoding;

/* órbitas discontinuas */
function ring(rad){const pts=[];for(let i=0;i<=240;i++){const a=i/240*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad))}
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0x8A8A8A,dashSize:.45,gapSize:.35,transparent:true}));
 l.computeLineDistances();S.add(l);return l}
function label(text,cls){const d=document.createElement('div');d.className='lbl '+cls;d.textContent=text;document.body.appendChild(d);return d}

/* el sol: el logo de Rivero. en PNG */
const LOGO_W=15,LOGO_H=LOGO_W*420/1262;
const sunMat=new THREE.SpriteMaterial({map:tex('img/rivero.png'),transparent:true,depthWrite:false});
const sun=new THREE.Sprite(sunMat);sun.scale.set(LOGO_W,LOGO_H,1);sun.userData.go='universo';S.add(sun);
const clickables=[sun];

/* planetas: esfera de papel + logo de la marca */
P.forEach(p=>{
 p.orbit=ring(p.r);p.v=0;
 const g=new THREE.Group();
 p.mm=new THREE.MeshLambertMaterial({color:0xFFFFFF,transparent:true});
 p.em=new THREE.MeshBasicMaterial({color:0x2A2A2A,transparent:true,side:THREE.BackSide});
 p.mesh=new THREE.Mesh(new THREE.SphereGeometry(p.size,96,64),p.mm);
 g.add(new THREE.Mesh(new THREE.SphereGeometry(p.size*1.02,96,64),p.em));g.add(p.mesh);S.add(g);p.g=g;
 p.tex=p.logos.map(tex);
 p.badge=new THREE.Sprite(new THREE.SpriteMaterial({map:p.tex[0],transparent:true,depthWrite:false}));
 p.badge.scale.set(p.size*1.6,p.size*1.6,1);S.add(p.badge);
 p.mesh.userData.go=p.badge.userData.go=p.id;clickables.push(p.mesh,p.badge);
 p.lbl=label(p.name,'');p.tag=label(p.num+' · órbita','tag');
});

/* cohete: sale de Rivero. hacia Nómada Sur */
function rocketTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.translate(64,64);
 x.fillStyle='#F28C28';x.beginPath();x.moveTo(-9,30);x.quadraticCurveTo(0,64,9,30);x.fill();
 x.fillStyle='#FFD166';x.beginPath();x.moveTo(-5,30);x.quadraticCurveTo(0,50,5,30);x.fill();
 x.fillStyle='#1E3A8A';x.beginPath();x.moveTo(-12,12);x.lineTo(-25,34);x.lineTo(-12,30);x.fill();x.beginPath();x.moveTo(12,12);x.lineTo(25,34);x.lineTo(12,30);x.fill();
 x.fillStyle='#fff';x.strokeStyle='#2A2A2A';x.lineWidth=2.5;x.beginPath();x.moveTo(0,-50);x.bezierCurveTo(21,-26,16,18,12,32);x.lineTo(-12,32);x.bezierCurveTo(-16,18,-21,-26,0,-50);x.fill();x.stroke();
 x.fillStyle='#1E3A8A';x.beginPath();x.arc(0,-12,7,0,7);x.fill();x.stroke();
 return new THREE.CanvasTexture(c)}
const T=P[1];
const rocket=new THREE.Sprite(new THREE.SpriteMaterial({map:rocketTex(),transparent:true,depthWrite:false,opacity:0}));S.add(rocket);
const trail=[],trailGeo=new THREE.BufferGeometry(),trailMat=new THREE.PointsMaterial({color:0x8A8A8A,size:.16,transparent:true,opacity:0});S.add(new THREE.Points(trailGeo,trailMat));
let lastU=0;const rA=new THREE.Vector3(),rB=new THREE.Vector3(),rM=new THREE.Vector3(),q1=new THREE.Vector3(),q2=new THREE.Vector3();
function bez(u,o){const k=1-u;return o.set(0,0,0).addScaledVector(rA,k*k).addScaledVector(rM,2*k*u).addScaledVector(rB,u*u)}
function flyRocket(){
 rA.set(0,LOGO_H*.6,0);rB.copy(T.g.position);rM.copy(rB).multiplyScalar(.5);rM.y+=10;
 const u=(t*.09)%1;if(u<lastU)trail.length=0;lastU=u;
 bez(u,rocket.position);bez(Math.min(u+.01,1),q2);
 q1.copy(rocket.position).project(C);q2.project(C);
 rocket.material.rotation=Math.atan2(q2.y-q1.y,(q2.x-q1.x)*C.aspect)-Math.PI/2;
 const s=Math.sin(u*Math.PI);rocket.scale.set(2.4*s+.4,2.4*s+.4,1);
 trail.push(rocket.position.clone());if(trail.length>70)trail.shift();trailGeo.setFromPoints(trail);
 const vis=intro?0:(!fp||fp===T)&&!fm?1:.06;
 rocket.material.opacity+=(vis-rocket.material.opacity)*.08;trailMat.opacity=rocket.material.opacity*.7;
}

/* navegación: universo → marca → sección */
let fp=null,fm=null,flying=true,t=0,intro=false;
const ACC=new THREE.Color(0x1E3A8A),INK=new THREE.Color(0x2A2A2A),GREY=new THREE.Color(0x8A8A8A);
function parse(h){const [pid,ms]=h.split('--');const p=P.find(x=>x.id===pid)||null;const m=p&&ms?p.parts.find(x=>x.slug===ms)||null:null;return [p,m]}
function setMode(h){
 [fp,fm]=parse(h);flying=true;ctr.enabled=false;
 const d=fm||fp||U,i=fm?fp.parts.indexOf(fm):-1,num=fm?fp.num+'.'+two(i+1):d.num;
 $('num').textContent=num;$('ttl').textContent=fm?fm.n:d.name;
 $('for').textContent=fm?fp.name+' · '+(fp.link?'marca real':'marca ficticia'):d.for;
 $('lead').textContent=d.lead;$('txt').textContent=d.txt;$('msg').textContent='';
 const items=fp?fp.parts.map((m,j)=>({h:fp.id+'--'+m.slug,n:m.n,k:fp.num+'.'+two(j+1),on:m===fm})):P.map(p=>({h:p.id,n:p.name+' — '+(p.link?'real':'ficticia'),k:p.num}));
 $('list').innerHTML=items.map(x=>`<a href="#${x.h}" class="${x.on?'on':''}">${esc(x.n)}<span>${x.k}</span></a>`).join('');
 const cr=[['universo','Rivero.']];if(fp)cr.push([fp.id,fp.name]);if(fm)cr.push([fp.id+'--'+fm.slug,fm.n]);
 $('crumbs').innerHTML=cr.map((c,j)=>j<cr.length-1?`<a href="#${c[0]}">${esc(c[1])}</a><span>/</span>`:`<b>${esc(c[1])}</b>`).join('');
 $('bar').innerHTML='josecarlosrivero.es'+(fp?'<b>/'+fp.id+(fm?'/'+fm.slug:'')+'</b>':'');
 renderAlt();
 const link=!fm&&fp&&fp.link;
 $('ctaLink').style.display=link?'inline-block':'none';$('cta').style.display=link?'none':'inline-block';
 if(link){$('ctaLink').href=fp.link;$('ctaLink').textContent=fp.cta}
 $('cta').textContent=fm?'Ver esta sección':(fp?fp.cta:U.cta);
 $('fig').innerHTML='<b>Fig. '+num+'</b>'+(fm?esc(fp.name)+' · sección '+(i+1)+' de '+fp.parts.length:fp?'Planeta '+fp.num+' · '+fp.parts.length+' secciones':'Sistema Rivero. · '+P.length+' planetas');
 document.querySelectorAll('#views a').forEach(a=>a.classList.toggle('on',a.dataset.m===(fp?fp.id:'universo')));
}
function renderAlt(){
 if(!fp){$('alt').innerHTML='';return}
 $('alt').innerHTML='Propuesta de logo '+fp.logos.map((_,j)=>`<button type="button" data-v="${j}" class="${fp.v===j?'on':''}">${'AB'[j]}</button>`).join('');
}
$('alt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!fp)return;fp.v=+b.dataset.v;fp.badge.material.map=fp.tex[fp.v];fp.badge.material.needsUpdate=true;renderAlt()});
$('cta').onclick=()=>{$('msg').textContent=!fp?'Toca un planeta o usa las pestañas de arriba.':fm?'En la web real, aquí se abriría esta sección completa.':'Proyecto de ejemplo: en la web real, aquí estaría el caso completo.'};
addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
addEventListener('keydown',e=>{
 if(intro){endIntro();return}
 if(e.key==='Escape'){location.hash=fm?fp.id:'universo'}
 else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const dir=e.key==='ArrowRight'?1:-1;
  if(fm){const n=fp.parts.length,j=(fp.parts.indexOf(fm)+dir+n)%n;location.hash=fp.id+'--'+fp.parts[j].slug}
  else{const ids=['universo',...P.map(p=>p.id)],j=(ids.indexOf(fp?fp.id:'universo')+dir+ids.length)%ids.length;location.hash=ids[j]}}
});

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
function hit(e){ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(ptr,C);
 const h=ray.intersectObjects(clickables).filter(x=>x.object.material.opacity>.3);return h.length?h[0].object.userData.go:null}
R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(intro){endIntro();return}if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>5)return;const g=hit(e);if(g)location.hash=g});
R.domElement.addEventListener('pointermove',e=>{R.domElement.style.cursor=intro?'default':hit(e)?'pointer':'grab'});

const tmp=new THREE.Vector3();
function proj(v){v.project(C);return[(v.x*.5+.5)*innerWidth,(-v.y*.5+.5)*innerHeight,v.z<1]}
function placeAt(el,v,dy){tmp.copy(v);tmp.y-=dy;const[x,y,ok]=proj(tmp);el.style.left=x+'px';el.style.top=y+'px';el.style.display=ok?'block':'none'}

/* tamaño de la escena según la pantalla */
const HOME=new THREE.Vector3(0,34,44),INTRO=new THREE.Vector3();let K=1;
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();
 K=C.aspect<1?Math.min(2.1,1/C.aspect):1;HOME.set(0,34*K,44*K);
 const d=Math.max(12,LOGO_W/(.55*2*Math.tan(THREE.MathUtils.degToRad(20))*C.aspect));INTRO.set(0,d*.12,d)}
addEventListener('resize',resize);resize();

/* intro: bienvenida con el logo y alejamiento hasta ver el sistema */
let introTimer=null;
function startIntro(){intro=true;P.forEach(p=>{p.mm.opacity=p.em.opacity=p.badge.material.opacity=p.orbit.material.opacity=0});document.body.classList.add('intro');C.position.copy(INTRO);ctr.target.set(0,0,0);C.lookAt(0,0,0);introTimer=setTimeout(endIntro,2800)}
function endIntro(){if(!intro)return;intro=false;clearTimeout(introTimer);document.body.classList.remove('intro');flying=true;ctr.enabled=false}
$('skip').onclick=endIntro;

const clock=new THREE.Clock(),want=new THREE.Vector3(),UP=new THREE.Vector3(),ORIGIN=new THREE.Vector3();
function lerpTo(o,k){o.material.opacity+=(k-o.material.opacity)*.08}
function loop(){
 const dt=Math.min(clock.getDelta(),.05);t+=dt;
 lerpTo(sun,fp?.04:1);
 P.forEach(p=>{
  const a=p.a0+t*p.speed;p.g.position.set(Math.cos(a)*p.r,0,Math.sin(a)*p.r);
  const on=!fp||fp===p,isF=fp===p,v=intro?0:on?1:.06;
  p.mm.opacity+=(v-p.mm.opacity)*.08;p.em.opacity=p.mm.opacity;p.em.color.lerp(isF?ACC:INK,.08);
  p.badge.position.copy(p.g.position).addScaledVector(tmp.copy(C.position).sub(p.g.position).normalize(),p.size*1.03);
  p.badge.material.opacity=p.mm.opacity;
  p.orbit.material.opacity+=((intro?.0:on?1:.06)-p.orbit.material.opacity)*.06;p.orbit.material.color.lerp(isF?ACC:GREY,.08);
  placeAt(p.lbl,p.g.position,p.size*1.15+.4);p.lbl.style.opacity=isF?0:p.mm.opacity;
  tmp.set(Math.cos(-.75)*p.r,0,Math.sin(-.75)*p.r);placeAt(p.tag,tmp,0);p.tag.style.opacity=fp?0:1;
 });
 flyRocket();
 if(intro){C.position.lerp(INTRO,.05);C.lookAt(ORIGIN)}
 else if(fp){
  const pp=fp.g.position,dir=pp.clone().normalize();
  want.copy(pp).addScaledVector(dir,14*K).add(UP.set(0,5,0));
  C.position.lerp(want,.05);ctr.target.lerp(pp,.08);C.lookAt(ctr.target);
 }else if(flying){
  C.position.lerp(HOME,.028);ctr.target.lerp(ORIGIN,.08);C.lookAt(ctr.target);
  if(C.position.distanceTo(HOME)<.4){flying=false;ctr.enabled=true}
 }else ctr.update();
 R.render(S,C);requestAnimationFrame(loop);
}
const start=location.hash.slice(1)||'universo';
setMode(start);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!parse(start)[0]&&!calm)startIntro();else C.position.copy(HOME);
loop();
}
</script>
</body>
</html>
